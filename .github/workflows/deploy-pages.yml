name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Assemble public files
        run: bash scripts/build-pages.sh "${{ runner.temp }}/transparency-fun-site"
      - name: Verify published asset references
        run: node scripts/check-pages.mjs "${{ runner.temp }}/transparency-fun-site"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/transparency-fun-site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
